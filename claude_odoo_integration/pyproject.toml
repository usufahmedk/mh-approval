[project]
name = "claude-odoo-integration"
version = "0.1.0"
description = "Claude Code integration layer for Odoo.sh via XML-RPC/JSON-RPC"
requires-python = ">=3.9"
dependencies = ["python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_odoo_integration*"]